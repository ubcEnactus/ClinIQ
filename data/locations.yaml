# Stage 1 directory: ten real Vancouver locations, entered by hand.
#
# Captured Sunday 25 Oct 2026 around 12:05 p.m. PDT.
#   - Emergency departments and Urgent and Primary Care Centres: name,
#     address, coordinates, phone, hours and wait from edwaittimes.ca
#     (Vancouver Coastal Health). Their "wait" is the time for 9 in 10
#     patients to see a physician, published 12:02 p.m.
#   - Walk-in clinics and pharmacies: name, address, coordinates, phone and
#     hours from their medimap.ca listings. No walk-in in Vancouver had
#     published a current wait that day (only automated overnight resets),
#     and pharmacies don't publish waits, so those are null.
#
# None of these are ClinIQ customers (participating: false). Pharmacies were
# chosen from chains that advertise minor ailment assessments in BC; confirm
# per store before a live pilot.
#
# Waits go stale within the hour. Re-capture before a demo: open
# edwaittimes.ca, update each ED/UPCC wait and read_at, and add walk-in
# waits from medimap.ca if a clinic shows a recent one. No invented numbers.
locations:
